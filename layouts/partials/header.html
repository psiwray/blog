<header class="site-header">
  <a class="site-brand" href="{{ .Site.Home.RelPermalink }}">
    <img class="site-mark" src="{{ "images/icon.png" | relURL }}" alt="" width="32" height="32">
    <span class="site-title">{{ .Site.Title }}</span>
  </a>
  {{ with .Site.Menus.main }}
  <nav class="site-nav">
    {{ range . }}<a href="{{ .URL | relURL }}">{{ .Name }}</a>{{ end }}
  </nav>
  {{ end }}
</header>
