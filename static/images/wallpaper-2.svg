    <circle cx="100" cy="90" r="2" />
    <circle cx="260" cy="70" r="2" />
    <circle cx="70" cy="220" r="2" />
    <circle cx="70" cy="280" r="2" />
    <circle cx="180" cy="230" r="2" />
    <circle cx="250" cy="300" r="2" />
    <circle cx="300" cy="300" r="2" />
    <circle cx="140" cy="300" r="1.5" />
  </g>
</svg>
