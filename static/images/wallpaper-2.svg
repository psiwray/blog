    <path d="M40,30 L40,90 L100,90 L100,140" />
    <path d="M260,20 L260,70 L300,70" />
    <path d="M20,220 L70,220 L70,280 L20,280" />
    <path d="M180,180 L180,230 L230,230" />
    <path d="M250,250 L250,300 L300,300 L300,330" />
    <path d="M90,300 L140,300" />
  </g>
  <g fill="none" stroke="#b9b9ba" stroke-width="1.5">
    <circle cx="40" cy="30" r="5" />
    <circle cx="100" cy="140" r="4" />
    <circle cx="260" cy="20" r="4" />
    <circle cx="300" cy="70" r="5" />
    <circle cx="20" cy="220" r="5" />
    <circle cx="20" cy="280" r="4" />
    <circle cx="180" cy="180" r="4" />
    <circle cx="230" cy="230" r="5" />
    <circle cx="250" cy="250" r="4" />
    <circle cx="300" cy="330" r="3" />
    <circle cx="150" cy="60" r="4" />
    <circle cx="90" cy="300" r="3" />
  </g>
  <g fill="#b9b9ba">
