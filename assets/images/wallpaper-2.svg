  <!-- Second wallpaper layer: same trace/via grammar as wallpaper.svg, but a
       larger, sparser tile so it layers with wallpaper.svg (different tile
       size, offset in CSS) instead of repeating in lockstep with it. Same
       overlap discipline as wallpaper.svg: every lead ends at a pad outside
       its component's body, and every trace/via was checked clear of all
       three component footprints below. -->
