<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Ψray wallpaper tile: same trace/via grammar as icon.png (right-angle
       circuit traces plus hollow "via" rings, filled "solder point" dots at
       junctions), kept fully inside the tile so background-repeat needs no
       edge-matching. Color is base.css's trace-soft custom property value,
       hardcoded since an externally-referenced SVG can't read CSS custom
       properties; keep the two in sync if the palette ever changes.

       Layout is quadrant-based (transistor / capacitor / resistor / IC),
       and every trace, lead, via and solder dot below was checked against
       each component's bounding box so nothing overlaps a component body
       and no two lines cross without a marked junction: no via renders
       inside a component, and no trace cuts through one. -->
  <g fill="none" stroke="#b9b9ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M54,58 L54,90 L15,90" />
    <path d="M60,58 L60,110 L105,110" />
    <path d="M66,58 L66,75 L105,75" />
    <path d="M20,10 L20,44 L38,44" />
    <path d="M90,15 L90,40" />
    <path d="M173,161 L173,135" />
    <path d="M183,161 L183,145" />
    <path d="M193,161 L193,120" />
    <path d="M220,20 L220,60 L230,60" />
    <path d="M140,20 L140,45" />
    <path d="M20,197 L20,220 L10,220" />
    <path d="M84,197 L100,197 L100,215" />
    <path d="M50,220 L50,235" />
    <path d="M15,150 L15,180" />
    <path d="M184,83 L184,110 L160,110" />
    <path d="M196,83 L196,115 L225,115" />
    <path d="M150,230 L190,230 L190,210" />
    <path d="M230,150 L230,200" />
    <path d="M173,189 L173,205" />
    <path d="M193,189 L193,210 L215,210" />
  </g>
  <!-- Component footprints: PCB silkscreen outlines rather than schematic
       symbols, to match "board" rather than "diagram" — an IC package (pin
       ticks off two long edges), an axial resistor and a disc capacitor
       (body straddling their own two leads, the way real silkscreen draws
       a passive's body over its own pads), and a TO-92 transistor (flat-
       bottomed body over three legs). Every lead ends at a pad outside the
       component's own body, so no via ever lands inside a footprint. -->
  <g fill="none" stroke="#b9b9ba" stroke-width="2" stroke-linecap="round">
    <rect x="166" y="167" width="34" height="16" />
    <path d="M173,167 L173,161 M183,167 L183,161 M193,167 L193,161" />
    <path d="M173,183 L173,189 M183,183 L183,189 M193,183 L193,189" />
    <rect x="34" y="190" width="36" height="14" />
    <path d="M34,197 L20,197 M70,197 L84,197" />
    <circle cx="190" cy="55" r="14" />
    <path d="M178,48 L178,62" />
    <path d="M184,69 L184,83 M196,69 L196,83" />
    <path d="M48,32 A12,12 0 0 1 72,32 L72,44 L48,44 Z" />
    <path d="M54,44 L54,58 M60,44 L60,58 M66,44 L66,58" />
  </g>
  <g fill="none" stroke="#b9b9ba" stroke-width="1.5">
    <circle cx="10" cy="220" r="3" />
    <circle cx="15" cy="90" r="3" />
    <circle cx="15" cy="150" r="3" />
    <circle cx="15" cy="180" r="3" />
    <circle cx="20" cy="10" r="3" />
