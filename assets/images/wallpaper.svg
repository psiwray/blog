<svg xmlns="http://www.w3.org/2000/svg" width="240" height="240" viewBox="0 0 240 240">
  <!-- Ψray wallpaper tile: same trace/via grammar as icon.png (right-angle
       circuit traces plus hollow "via" rings, filled "solder point" dots at
       junctions), kept fully inside the tile so background-repeat needs no
       edge-matching. Color is base.css's trace-soft custom property value,
       hardcoded since an externally-referenced SVG can't read CSS custom
       properties; keep the two in sync if the palette ever changes. -->
  <g fill="none" stroke="#b9b9ba" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20,20 L20,60 L70,60" />
    <path d="M180,10 L180,50 L220,50 L220,90" />
    <path d="M10,120 L50,120 L50,160 L90,160" />
    <path d="M120,90 L120,130" />
    <path d="M120,110 L150,110" />
    <path d="M160,180 L200,180 L200,220" />
    <path d="M30,190 L30,220 L70,220" />
    <path d="M200,20 L230,20" />
    <path d="M140,20 L140,40 L160,40 L160,60 L190,60" />
    <path d="M60,80 L60,100 L90,100 L90,130" />
    <path d="M110,150 L110,200" />
  </g>
  <!-- Component footprints: PCB silkscreen outlines rather than schematic
       symbols, to match "board" rather than "diagram" — an IC package (pin
       ticks off two long edges, a corner dot for the pin-1 marker) and a
       two-pad passive straddling a trace, the same way real silkscreen
       draws a resistor/capacitor body over its own pads. -->
  <g fill="none" stroke="#b9b9ba" stroke-width="2" stroke-linecap="round">
    <rect x="196" y="127" width="34" height="16" />
    <path d="M203,127 L203,121 M213,127 L213,121 M223,127 L223,121" />
    <path d="M203,143 L203,149 M213,143 L213,149 M223,143 L223,149" />
    <rect x="104" y="168" width="12" height="14" />
  </g>
  <g fill="none" stroke="#b9b9ba" stroke-width="1.5">
    <circle cx="20" cy="20" r="4" />
    <circle cx="70" cy="60" r="3" />
    <circle cx="180" cy="10" r="4" />
    <circle cx="220" cy="90" r="3" />
    <circle cx="10" cy="120" r="3" />
    <circle cx="90" cy="160" r="4" />
    <circle cx="120" cy="90" r="3" />
    <circle cx="120" cy="130" r="3" />
    <circle cx="160" cy="180" r="4" />
    <circle cx="200" cy="220" r="3" />
    <circle cx="30" cy="190" r="3" />
    <circle cx="70" cy="220" r="4" />
    <circle cx="200" cy="20" r="3" />
    <circle cx="140" cy="20" r="3" />
    <circle cx="190" cy="60" r="4" />
    <circle cx="60" cy="80" r="3" />
    <circle cx="90" cy="130" r="3" />
    <circle cx="110" cy="150" r="3" />
    <circle cx="110" cy="200" r="3" />
  </g>
  <g fill="#b9b9ba">
    <circle cx="20" cy="60" r="2" />
    <circle cx="180" cy="50" r="2" />
    <circle cx="50" cy="120" r="2" />
    <circle cx="120" cy="110" r="1.5" />
    <circle cx="200" cy="180" r="2" />
    <circle cx="30" cy="220" r="2" />
    <circle cx="230" cy="20" r="2" />
    <circle cx="160" cy="40" r="1.5" />
    <circle cx="160" cy="60" r="1.5" />
    <circle cx="90" cy="100" r="1.5" />
    <circle cx="199" cy="130" r="1.5" />
  </g>
</svg>
